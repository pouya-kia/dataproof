name: quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Lint and types
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Full tests
        run: pytest -q
      - name: Dependency security audit
        run: pip-audit --local --progress-spinner off
      - name: Build and clean install
        run: |
          python -m build
          python -m venv clean-venv
          clean-venv/bin/python -m pip install dist/*.whl
          clean-venv/bin/dataproof check examples/no_undo/daily_distinct.json --output artifacts/ci
          clean-venv/bin/dataproof replay artifacts/ci/witness.json
